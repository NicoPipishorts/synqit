<svg xmlns="http://www.w3.org/2000/svg" viewBox="96.05 101.45 440 440" width="300" height="300">
  <title>Synqit loading spinner — sync-arrows mark, for dark surfaces</title>

  <style>
    .spin-arrows {
      transform-box: view-box;
      /* Percentages, not lengths: with `view-box` the origin sits at the viewBox's
         own corner, and the viewBox is centred on the mark, so 50% 50% is the
         mark's centre by construction. */
      transform-origin: 50% 50%;
      animation: spinSpring 4s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    @keyframes spinSpring {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(1080deg); }
      58%  { transform: rotate(1124deg); }
      67%  { transform: rotate(1050deg); }
      75%  { transform: rotate(1096deg); }
      82%  { transform: rotate(1074deg); }
      88%  { transform: rotate(1080deg); }
      100% { transform: rotate(1080deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin-arrows { animation-duration: 8s; }
    }
  </style>

  <g class="spin-arrows">
    <g transform="translate(0.000000,635.000000) scale(0.100000,-0.100000)" stroke="none">
