333 -2.66666666667,-0.266666666667 -2.93333333333,0.8 z"/>
    </g>
  </g>

  <g class="spin-spring" filter="url(#glow)">
    <line class="arrow-halo" x1="181.0" y1="115.8" x2="153.5" y2="68.2" stroke-width="27" stroke-linecap="round"/>
    <line class="arrow-core" x1="181.0" y1="115.8" x2="153.5" y2="68.2" stroke-width="19" stroke-linecap="round"/>

    <line class="arrow-halo" x1="124.2" y1="167.9" x2="70.9" y2="130.6" stroke-width="27" stroke-linecap="round"/>
    <line class="arrow-core" x1="124.2" y1="167.9" x2="70.9" y2="130.6" stroke-width="19" stroke-linecap="round"/>

    <line class="arrow-halo" x1="98.1" y1="223.9" x2="57.5" y2="213.1" stroke-width="27" stroke-linecap="round"/>
    <line class="arrow-core" x1="98.1" y1="223.9" x2="57.5" y2="213.1" stroke-width="19" stroke-linecap="round"/>
  </g>
</svg>
