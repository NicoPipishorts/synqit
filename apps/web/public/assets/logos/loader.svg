<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="300" height="300">
  <title>Loading spinner — logo mark with orbiting arrows</title>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="haloBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <style>
    .spin-spring {
      transform-box: view-box;
      transform-origin: 270px 270px;
      animation: spinSpring 4s cubic-bezier(0.45,0,0.55,1) infinite;
    }
    @keyframes spinSpring {
      0%   { transform: rotate(0deg); }
      50%  { transform: rotate(1080deg); }
      58%  { transform: rotate(1124deg); }
      67%  { transform: rotate(1050deg); }
      75%  { transform: rotate(1096deg); }
      82%  { transform: rotate(1074deg); }
      88%  { transform: rotate(1080deg); }
      100% { transform: rotate(1080deg); }
    }
    .arrow-halo { stroke: #D7FB51; }
    .arrow-core { stroke: #0A0A08; }
  </style>

  <g id="logo-mark">
    <circle cx="270" cy="270" r="168" fill="#D7FB51" opacity="0.55" filter="url(#haloBlur)"/>
    <circle cx="270" cy="270" r="150" fill="#D7FB51"/>
