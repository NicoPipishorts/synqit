global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: synqit-api
    metrics_path: /metrics
    # Must match METRICS_TOKEN in infra/.env. The file is mounted by docker-compose
    # from infra/observability/metrics_token (gitignored).
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['api:3001']
