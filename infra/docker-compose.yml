name: synqit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synqit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synqit
    volumes:
      - /srv/synqit/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synqit -d synqit']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - /srv/synqit/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./.env
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      API_BASE_URL: https://app.synqit.fr/api
      CORS_ORIGINS: https://app.synqit.fr,https://admin.synqit.fr,https://synqit.fr
      DATABASE_URL: postgresql://synqit:${POSTGRES_PASSWORD}@postgres:5432/synqit
      EVENT_LINK_BASE_URL: https://app.synqit.fr
      REDIS_URL: redis://redis:6379
      SPOTIFY_REDIRECT_URI: https://app.synqit.fr/api/v1/auth/spotify/callback
      TIDAL_REDIRECT_URI: https://app.synqit.fr/api/v1/auth/tidal/callback
      WEB_APP_URL: https://app.synqit.fr
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - /srv/synqit/data/uploads/avatars:/app/data/uploads/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://synqit:${POSTGRES_PASSWORD}@postgres:5432/synqit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  site:
    build:
      context: ..
      dockerfile: apps/site/Dockerfile
    ports:
      - '127.0.0.1:4173:4173'
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '127.0.0.1:5173:5173'
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    ports:
      - '127.0.0.1:4174:4174'
    restart: unless-stopped
