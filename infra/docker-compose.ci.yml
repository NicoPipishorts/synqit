name: synqit

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synqit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synqit
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - /srv/synqit/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synqit -d synqit']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - /srv/synqit/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: ghcr.io/nicopipishorts/synqit-api:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://synqit:${POSTGRES_PASSWORD}@postgres:5432/synqit
      REDIS_URL: redis://redis:6379
      API_BASE_URL: https://app.synqit.fr/api
      CORS_ORIGINS: https://app.synqit.fr,https://synqit.fr
      EVENT_LINK_BASE_URL: https://app.synqit.fr
      SPOTIFY_REDIRECT_URI: https://app.synqit.fr/api/v1/auth/spotify/callback
      TIDAL_REDIRECT_URI: https://app.synqit.fr/api/v1/auth/tidal/callback
      WEB_APP_URL: https://app.synqit.fr
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - /srv/synqit/data/uploads/avatars:/app/data/uploads/avatars
      # Event cover images live next to avatars; without this mount every deploy
      # (`up --force-recreate`) wiped them and the stored URLs went dead.
      - /srv/synqit/data/uploads/event-images:/app/data/uploads/event-images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/nicopipishorts/synqit-worker:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://synqit:${POSTGRES_PASSWORD}@postgres:5432/synqit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    image: ghcr.io/nicopipishorts/synqit-admin:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:4174:4174'
    restart: unless-stopped

  site:
    image: ghcr.io/nicopipishorts/synqit-site:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:4173:4173'
    restart: unless-stopped

  web:
    image: ghcr.io/nicopipishorts/synqit-web:${IMAGE_TAG:-latest}
    ports:
      - '127.0.0.1:5173:5173'
    restart: unless-stopped

  migrate:
    image: ghcr.io/nicopipishorts/synqit-api:${IMAGE_TAG:-latest}
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://synqit:${POSTGRES_PASSWORD}@postgres:5432/synqit
    working_dir: /app/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy', '--config', '/app/apps/api/prisma.config.ts']
    volumes:
      - /srv/synqit/repo/apps/api/prisma:/app/apps/api/prisma:ro
      - /srv/synqit/repo/apps/api/prisma.config.ts:/app/apps/api/prisma.config.ts:ro
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
