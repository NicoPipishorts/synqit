# infra/docker-compose.override.local.yml
services:
  postgres:
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - synqit_postgres_local:/var/lib/postgresql/data

  redis:
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - synqit_redis_local:/data

volumes:
  synqit_postgres_local:
  synqit_redis_local:
