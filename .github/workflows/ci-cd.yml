name: CI and Deploy

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nicopipishorts

jobs:
  api-regression:
    name: api-regression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synqit
          POSTGRES_PASSWORD: synqit
          POSTGRES_DB: synqit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synqit -d synqit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://synqit:synqit@localhost:5432/synqit
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      TOKEN_ENC_KEY: test-token-enc-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn build:shared

      - name: Generate Prisma client
        run: yarn workspace @synqit/api prisma:generate

      - name: Apply Prisma migrations
        run: yarn workspace @synqit/api prisma:migrate:deploy

      - name: Fail on schema drift between migrations and schema.prisma
        run: yarn workspace @synqit/api prisma:drift

      - name: Run API regression tests
        run: yarn workspace @synqit/api test

  web-e2e:
    name: web-e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn build:shared

      - name: Install Playwright browser
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Run web e2e smoke tests
        run: yarn workspace @synqit/web test:e2e

  build-and-push:
    name: build-and-push
    needs:
      - api-regression
      - web-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for site
        id: meta_site
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-site
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: ${{ steps.meta_site.outputs.tags }}
          labels: ${{ steps.meta_site.outputs.labels }}

      - name: Extract metadata for web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-web
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}

      - name: Extract metadata for api
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Extract metadata for worker
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-worker
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}

      - name: Extract metadata for admin
        id: meta_admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-admin
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta_admin.outputs.tags }}
          labels: ${{ steps.meta_admin.outputs.labels }}

  deploy:
    name: deploy
    needs:
      - build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /srv/synqit/deploy.sh latest
