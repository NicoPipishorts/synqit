name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/nicopipishorts

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for site
        id: meta_site
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-site
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/site/Dockerfile
          push: true
          tags: ${{ steps.meta_site.outputs.tags }}
          labels: ${{ steps.meta_site.outputs.labels }}

      - name: Extract metadata for web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-web
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}

      - name: Extract metadata for api
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-api
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Extract metadata for worker
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-worker
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}

      - name: Extract metadata for admin
        id: meta_admin
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nicopipishorts/synqit-admin
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta_admin.outputs.tags }}
          labels: ${{ steps.meta_admin.outputs.labels }}

    deploy:
      needs: build-and-push
      runs-on: ubuntu-latest

      steps:
        - name: Deploy on VPS over SSH
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USER }}
            key: ${{ secrets.VPS_SSH_KEY }}
            script: |
              /srv/synqit/deploy.sh latest
